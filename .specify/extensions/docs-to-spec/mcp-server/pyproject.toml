[project]
name = "docs-to-spec-mcp"
version = "0.1.0"
description = "Local MCP server that harvests wikis, issues, Confluence and docs into a redacted snapshot for Spec Kit"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
docs-to-spec-mcp = "docs_to_spec_mcp.server:main"
docs-to-spec = "docs_to_spec_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_to_spec_mcp"]
