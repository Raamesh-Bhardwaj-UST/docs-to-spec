# docs-to-spec sources. Patterns are fnmatch-style; '*' also matches '/'.
version: 1
snapshot_dir: .specify/harvest/raw   # committed, so reviews and re-runs diff cleanly

redaction:
  emails: false          # set true to also redact e-mail addresses

sources:
  - id: product-wiki
    type: github-wiki
    repo: OWNER/REPO                 # the repo whose wiki you want
    auth: gcm                        # gcm = Git Credential Manager (recommended); token = GH_TOKEN
    include: ["*.md"]
    exclude: ["*_Sidebar.md", "*_Footer.md"]

  - id: feature-requests
    type: github-issues
    repo: OWNER/REPO
    state: open                      # open | closed | all
    labels: ["feature-request"]      # multiple labels = AND
    max_items: 200
    include_comments: true

  - id: team-confluence
    type: confluence
    base_url: https://YOUR-SITE.atlassian.net/wiki   # Data Center: https://confluence.example.com (with any context path)
    # deployment: cloud              # cloud | datacenter (default: cloud for *.atlassian.net, else datacenter)
    # auth: basic                    # basic = CONFLUENCE_EMAIL + CONFLUENCE_TOKEN (Cloud default); bearer = CONFLUENCE_TOKEN PAT (Data Center default)
    space: SPACEKEY                  # at least one of space, ancestor, labels or cql is required
    # ancestor: "123456"             # only pages under this page id
    # labels: ["requirements"]       # multiple labels = AND
    # cql: 'space = "SPACEKEY" AND label = "requirements"'   # replaces space/ancestor/labels; pages only
    max_items: 200

  - id: repo-docs
    type: local
    path: docs                       # relative to the repo root
    include: ["*.md"]
    exclude: []
